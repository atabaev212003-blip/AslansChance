name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
# GitHub Actions создаёт временную виртуальную машину с Ubuntu.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
# Скачивает весь твой репозиторий в виртуальную машину.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
# Войти в Docker Hub.
 # Использует секреты (логин и пароль), которые ты сохранил в GitHub → Settings → Secrets.
      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest --load .
 # Собирает Docker-образ и даёт ему имя: <твой_логин>/my-app:latest.
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest . 

# Загружает собранный образ в твой аккаунт на Docker Hub


